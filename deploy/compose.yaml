services:
  app:
    image: nihongonotto:${RELEASE_TAG:-latest}
    build:
      context: ..
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    env_file: /opt/nihongonotto/shared/app.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /opt/nihongonotto/shared/oci.pem:/run/secrets/oci.pem:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
